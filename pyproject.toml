[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldsys"
version = "0.1.0"
description = "Look-ahead-safe XAUUSD research and backtesting system"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6", "typer>=0.9", "pyarrow>=12"]

[project.scripts]
goldsys = "goldsys.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
